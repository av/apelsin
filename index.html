<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f3f1">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Apelsin: slice a photoreal orange</title>
<meta name="description" content="A photoreal orange in your browser. Slice it with a knife, then pick up the pieces and toss them around. Real-time WebGL2 with physics and synthesised sound.">
<meta property="og:type" content="website">
<meta property="og:title" content="Apelsin: slice a photoreal orange">
<meta property="og:description" content="Slice and toss a photoreal orange in your browser. WebGL2, real physics, juice and sound.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.38' cy='.36' r='.7'%3E%3Cstop offset='0' stop-color='%23ffb84d'/%3E%3Cstop offset='.6' stop-color='%23f58a0b'/%3E%3Cstop offset='1' stop-color='%23d46a00'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='18' r='12.5' fill='url(%23g)'/%3E%3Cpath d='M16 6.2c.6-2 2.2-3.3 4.6-3.6-.3 2.3-1.8 3.8-4.6 3.6z' fill='%235d8a2a'/%3E%3Ccircle cx='16' cy='6.6' r='1.1' fill='%236b4a1c'/%3E%3C/svg%3E">
<style>
  :root { --glass: rgba(255, 255, 255, 0.58); --glass-edge: rgba(255, 255, 255, 0.55); --ink: #2a2522; --muted: #6f6660; --line: rgba(127, 110, 100, 0.18); --on: #2a2522; --on-ink: #fff; --tip: rgba(30, 26, 24, 0.9); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f4f3f1; color: var(--ink);
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #overlay { pointer-events: none; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center;
    padding: 4px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: 0 8px 30px rgba(40, 30, 20, 0.1), 0 1px 2px rgba(40, 30, 20, 0.06), inset 0 0 0 1px var(--glass-edge); transition: opacity 0.3s; }
  .group { display: flex; gap: 1px; }
  .group + .group { margin-left: 9px; position: relative; }
  .group + .group::before { content: ""; position: absolute; left: -5px; top: 50%; width: 1px; height: 18px; transform: translateY(-50%); background: var(--line); }
  button { position: relative; appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; height: 36px; width: 36px; padding: 0; border-radius: 11px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s, transform 0.1s; }
  button:hover { background: rgba(127, 110, 100, 0.12); color: var(--ink); }
  button:active { transform: scale(0.94); }
  button:focus-visible { outline: 2px solid #f08a12; outline-offset: 1px; }
  button.on { background: rgba(127, 110, 100, 0.16); color: var(--ink); }
  [data-tool].on { background: var(--on); color: var(--on-ink); }
  button svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  [data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translate(-50%, 4px); padding: 6px 9px; border-radius: 8px;
    background: var(--tip); color: var(--on-ink); font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s, transform 0.15s; z-index: 2; }
  @media (hover: hover) { [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 0.35s; } }
  #hint { position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--glass-edge); color: var(--muted); transition: opacity 0.8s, transform 0.8s;
    pointer-events: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  #hint svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #hint.gone { opacity: 0; transform: translate(-50%, -6px); }
  #fps { position: fixed; right: 10px; top: 10px; font: 11px ui-monospace, monospace; color: var(--muted); white-space: pre; pointer-events: none; }
  #nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); font-size: 15px; }
  @media (max-width: 480px), (pointer: coarse) {
    #bar { left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); transform: none; width: auto; max-width: 420px; margin: 0 auto;
      bottom: calc(10px + env(safe-area-inset-bottom)); border-radius: 18px; }
    .group { flex: 2 1 0; }
    .group.presets { flex-grow: 4; }
    .group.actions { flex-grow: 3; }
    .group + .group { margin-left: 7px; }
    .group + .group::before { left: -4px; }
    button { flex: 1 1 0; width: auto; min-width: 0; height: 44px; border-radius: 13px; }
    button svg { width: 20px; height: 20px; }
    [data-tip]::after { display: none; }
    #hint { top: calc(14px + env(safe-area-inset-top)); font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Orange"></canvas>
<canvas id="overlay"></canvas>
<div id="hint" role="status"><svg viewBox="0 0 24 24"><path d="M4 20 18.5 5.5c1.2 1.2 1.3 3 .2 4.1L8.5 19.8"/><path d="M3 21h4"/></svg><span id="hint-text">Drag across the orange to slice it</span></div>
<div id="fps" hidden></div>
<nav id="bar" aria-label="Toolbar">
  <div class="group tools" role="group" aria-label="Tool">
    <button data-tool="knife" data-tip="Knife · K" aria-label="Knife"><svg viewBox="0 0 24 24"><path d="M3.5 20.5 15.2 8.8"/><path d="M15.2 8.8 19.6 4.4c1.4 1.4 1.6 3.8.2 5.2l-3.8 3.8z"/><path d="M5.6 18.4l-2.1 2.1"/></svg></button>
    <button data-tool="hand" data-tip="Hand · H" aria-label="Hand"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6V4.5a1.5 1.5 0 0 1 3 0V12m0-5.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4 14.5a1.5 1.5 0 0 1 2.5-1.7L8 15"/></svg></button>
  </div>
  <div class="group presets" role="group" aria-label="Presets">
    <button data-preset="whole" data-tip="Whole · 1" aria-label="Whole"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 5c.3-1.3 1.2-2.1 2.6-2.3"/></svg></button>
    <button data-preset="halves" data-tip="Halves · 2" aria-label="Halves"><svg viewBox="0 0 24 24"><path d="M10.5 4a8 8 0 0 0 0 16z"/><path d="M13.5 4a8 8 0 0 1 0 16z"/><path d="M10.5 12 5 8.5M10.5 12H3M10.5 12 5 15.5M13.5 12 19 8.5M13.5 12H21M13.5 12 19 15.5"/></svg></button>
    <button data-preset="wedges" data-tip="Wedges · 3" aria-label="Wedges"><svg viewBox="0 0 24 24"><path d="M3 9h18a9 9 0 0 1-18 0z"/><path d="M12 9v9.5M12 9 5.2 15M12 9l6.8 6"/></svg></button>
    <button data-preset="reference" data-tip="Reference shot · 4" aria-label="Reference"><svg viewBox="0 0 24 24"><path d="M3 18 8.5 7.5 14 18z"/><path d="M11 15.5 15.5 7l5 9.5"/><path d="M3 18h17.5"/></svg></button>
  </div>
  <div class="group actions" role="group" aria-label="Actions">
    <button id="new" data-tip="New orange · N" aria-label="New orange"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg></button>
    <button id="sound" data-tip="Sound · A" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button id="shot" data-tip="Screenshot · P" aria-label="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  </div>
</nav>
<div id="nogl" hidden>Apelsin needs WebGL2. Try a current version of Chrome, Safari, Firefox or Edge.</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
