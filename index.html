<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f3f1">
<title>Apelsin</title>
<link rel="icon" href="data:,">
<style>
  :root { --glass: rgba(255, 255, 255, 0.62); --ink: #2a2522; --muted: #6f6660; --accent: #f08a12; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f3f1; font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: var(--ink); }
  body.dark { --glass: rgba(28, 26, 25, 0.6); --ink: #f1ece6; --muted: #a59b92; background: #0b0b0c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { pointer-events: none; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center;
    padding: 6px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 6px 30px rgba(40, 20, 0, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.35); max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  .group { display: flex; gap: 2px; padding-right: 6px; border-right: 1px solid rgba(127, 110, 100, 0.2); }
  .group:last-child { border-right: 0; padding-right: 0; }
  button, select { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; height: 38px; min-width: 38px; padding: 0 10px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
  select { padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 12px) 17px, calc(100% - 8px) 17px; background-size: 4px 4px; background-repeat: no-repeat; }
  button:hover, select:hover { background: rgba(127, 110, 100, 0.12); }
  button.on { background: var(--ink); color: #fff; }
  body.dark button.on { color: #111; }
  button svg { width: 18px; height: 18px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  button kbd { font: 10px/1 ui-monospace, monospace; opacity: 0.45; margin-left: 4px; }
  #hint { position: fixed; left: 50%; top: calc(22px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--muted); transition: opacity 0.8s; pointer-events: none; white-space: nowrap; }
  #hint.gone { opacity: 0; }
  #fps { position: fixed; right: 10px; top: 10px; font: 11px ui-monospace, monospace; color: var(--muted); white-space: pre; pointer-events: none; }
  #nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); font-size: 15px; }
  @media (max-width: 720px), (pointer: coarse) {
    #bar { left: 0; right: 0; transform: none; bottom: 0; border-radius: 18px 18px 0 0; max-width: none; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    button, select { height: 44px; min-width: 44px; }
    button kbd { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>
<div id="hint">Drag across the orange to slice it</div>
<div id="fps" hidden></div>
<nav id="bar" aria-label="Toolbar">
  <div class="group">
    <button data-tool="knife" title="Knife (K)" aria-label="Knife"><svg viewBox="0 0 24 24"><path d="M3 21 14.5 9.5M14.5 9.5l5-5c1 1 1.5 3 0 5l-3.5 3.5z"/></svg></button>
    <button data-tool="hand" title="Hand (H)" aria-label="Hand"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-6V4.5a1.5 1.5 0 0 1 3 0V12m0-5.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4 14.5a1.5 1.5 0 0 1 2.5-1.7L8 15"/></svg></button>
    <button data-tool="squeeze" title="Squeeze (S)" aria-label="Squeeze"><svg viewBox="0 0 24 24"><path d="M12 3c3 4.5 5.5 7.5 5.5 11a5.5 5.5 0 0 1-11 0C6.5 10.5 9 7.5 12 3z"/></svg></button>
  </div>
  <div class="group">
    <button data-preset="whole">Whole<kbd>1</kbd></button>
    <button data-preset="halves">Halves<kbd>2</kbd></button>
    <button data-preset="wedges">Wedges<kbd>3</kbd></button>
    <button data-preset="wheels">Wheels<kbd>4</kbd></button>
    <button data-preset="reference">Reference<kbd>5</kbd></button>
  </div>
  <div class="group">
    <select id="variety" aria-label="Variety"></select>
    <select id="scene" aria-label="Scene"></select>
  </div>
  <div class="group">
    <button id="new" title="New orange (N)">New<kbd>N</kbd></button>
    <button id="macro" title="Macro depth of field (M)">Macro<kbd>M</kbd></button>
    <button id="slowmo" title="Slow motion">Slow-mo</button>
    <button id="sound" title="Sound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button id="shot" title="Screenshot (P)" aria-label="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  </div>
</nav>
<div id="nogl" hidden>Apelsin needs WebGL2. Try a current version of Chrome, Safari, Firefox or Edge.</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
